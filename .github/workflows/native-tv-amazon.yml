name: Build Amazon Fire TV submission APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TIKTAK_TV_STORE_PASSWORD: ${{ secrets.TIKTAK_TV_STORE_PASSWORD }}
      TIKTAK_TV_KEY_ALIAS: ${{ secrets.TIKTAK_TV_KEY_ALIAS }}
      TIKTAK_TV_KEY_PASSWORD: ${{ secrets.TIKTAK_TV_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore permanent TV signing key
        env:
          TIKTAK_TV_KEYSTORE_BASE64: ${{ secrets.TIKTAK_TV_KEYSTORE_BASE64 }}
        run: |
          test -n "${TIKTAK_TV_KEYSTORE_BASE64}"
          test -n "${TIKTAK_TV_STORE_PASSWORD}"
          test -n "${TIKTAK_TV_KEY_ALIAS}"
          test -n "${TIKTAK_TV_KEY_PASSWORD}"
          TIKTAK_TV_KEYSTORE_FILE="${RUNNER_TEMP}/tiktak-tv-release.p12"
          printf '%s' "${TIKTAK_TV_KEYSTORE_BASE64}" | base64 --decode > "${TIKTAK_TV_KEYSTORE_FILE}"
          echo "TIKTAK_TV_KEYSTORE_FILE=${TIKTAK_TV_KEYSTORE_FILE}" >> "${GITHUB_ENV}"
      - name: Test, lint, and build signed Amazon APK
        run: ./gradlew :nativeTvApp:testDebugUnitTest :nativeTvApp:lintAppstore :nativeTvApp:assembleAppstore -Pnuvio.android.distribution=full --stacktrace
      - name: Verify Amazon package
        run: |
          apk="nativeTvApp/build/outputs/apk/appstore/nativeTvApp-appstore.apk"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -f "${apk}"
          "${apksigner}" verify --verbose --print-certs "${apk}"
          "${aapt}" dump badging "${apk}" | tee amazon-badging.txt
          grep -F "application-label:'TikTak TV'" amazon-badging.txt
          grep -F "leanback-launchable-activity:" amazon-badging.txt
          if "${aapt}" dump permissions "${apk}" | grep -F 'android.permission.REQUEST_INSTALL_PACKAGES'; then
            echo 'Amazon package must not request sideload install permission' >&2
            exit 1
          fi
          cp "${apk}" tiktak-tv-amazon-fire-tv.apk
          sha256sum tiktak-tv-amazon-fire-tv.apk > tiktak-tv-amazon-fire-tv.apk.sha256
      - name: Upload Amazon submission package
        uses: actions/upload-artifact@v7
        with:
          name: TikTak-TV-Amazon-Fire-TV
          path: |
            tiktak-tv-amazon-fire-tv.apk
            tiktak-tv-amazon-fire-tv.apk.sha256
            amazon-badging.txt
          if-no-files-found: error
          retention-days: 30
