name: Android TV APK

on:
  push:
    branches: [web-enhanced-pages]
    paths:
      - "tvApp/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/tv-android.yml"
  pull_request:
    paths:
      - "tvApp/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/tv-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test, lint, and build Fire TV and Android TV development APK
        run: ./gradlew :tvApp:testDebugUnitTest :tvApp:lintDebug :tvApp:assembleDebug -Pnuvio.android.distribution=full --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: TikTak-TV-Android-TV
          path: tvApp/build/outputs/apk/debug/tvApp-debug.apk
          if-no-files-found: error
          retention-days: 30

  tv-emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TikTak-TV-Android-TV
          path: tvApp/build/outputs/apk/debug
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app and verify remote focus on Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86
          target: android-tv
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            adb install -r tvApp/build/outputs/apk/debug/tvApp-debug.apk
            adb logcat -c
            adb shell am start -W -n com.tiktaktv.tv/.MainActivity
            sleep 20
            adb shell dumpsys activity activities > tv-activity.txt
            grep -Eq "(topResumedActivity|ResumedActivity).*com.tiktaktv.tv/.MainActivity" tv-activity.txt
            adb shell input keyevent 20
            adb shell input keyevent 22
            adb shell input keyevent 21
            adb shell input keyevent 19
            adb shell input keyevent 23
            adb shell input keyevent 85
            adb shell input keyevent 89
            adb shell input keyevent 90
            sleep 3
            adb shell dumpsys activity activities > tv-activity.txt
            adb exec-out screencap -p > tvApp/build/tv-emulator-smoke.png
            adb shell uiautomator dump /sdcard/tv-window.xml
            adb pull /sdcard/tv-window.xml tv-window.xml
            adb logcat -d > tv-app-logcat.txt
            grep -Eq "(topResumedActivity|ResumedActivity).*com.tiktaktv.tv/.MainActivity" tv-activity.txt
            ! grep -A 30 "FATAL EXCEPTION" tv-app-logcat.txt | grep -q "com.tiktaktv.tv"
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TikTak-TV-emulator-smoke
          path: |
            tvApp/build/tv-emulator-smoke.png
            tv-app-logcat.txt
            tv-activity.txt
            tv-window.xml
          if-no-files-found: warn
          retention-days: 30
