name: Android TV APK

on:
  push:
    branches: [web-enhanced-pages]
    paths:
      - "tvApp/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/tv-android.yml"
  pull_request:
    paths:
      - "tvApp/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/tv-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build Fire TV and Android TV development APK
        run: ./gradlew :tvApp:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: TikTak-TV-Android-TV
          path: tvApp/build/outputs/apk/debug/tvApp-debug.apk
          if-no-files-found: error
          retention-days: 30
