name: Publish Android TV APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-tv-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TIKTAK_TV_STORE_PASSWORD: ${{ secrets.TIKTAK_TV_STORE_PASSWORD }}
      TIKTAK_TV_KEY_ALIAS: ${{ secrets.TIKTAK_TV_KEY_ALIAS }}
      TIKTAK_TV_KEY_PASSWORD: ${{ secrets.TIKTAK_TV_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore permanent TV signing key
        env:
          TIKTAK_TV_KEYSTORE_BASE64: ${{ secrets.TIKTAK_TV_KEYSTORE_BASE64 }}
        run: |
          test -n "${TIKTAK_TV_KEYSTORE_BASE64}"
          test -n "${TIKTAK_TV_STORE_PASSWORD}"
          test -n "${TIKTAK_TV_KEY_ALIAS}"
          test -n "${TIKTAK_TV_KEY_PASSWORD}"
          TIKTAK_TV_KEYSTORE_FILE="${RUNNER_TEMP}/tiktak-tv-release.p12"
          printf '%s' "${TIKTAK_TV_KEYSTORE_BASE64}" | base64 --decode > "${TIKTAK_TV_KEYSTORE_FILE}"
          echo "TIKTAK_TV_KEYSTORE_FILE=${TIKTAK_TV_KEYSTORE_FILE}" >> "${GITHUB_ENV}"
      - name: Test and build signed release APK
        run: ./gradlew :tvApp:testDebugUnitTest :tvApp:lintRelease :tvApp:assembleRelease -Pnuvio.android.distribution=full --stacktrace
      - name: Verify APK signature
        run: |
          apk="tvApp/build/outputs/apk/release/tvApp-release.apk"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -f "${apk}"
          "${apksigner}" verify --verbose --print-certs "${apk}"
          cp "${apk}" tiktak-tv-android-tv.apk
          sha256sum tiktak-tv-android-tv.apk > tiktak-tv-android-tv.apk.sha256
          aapt="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          badging="$("${aapt}" dump badging "${apk}" | head -1)"
          version_code="$(printf '%s' "${badging}" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          version_name="$(printf '%s' "${badging}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          sha256="$(cut -d ' ' -f1 tiktak-tv-android-tv.apk.sha256)"
          test -n "${version_code}"
          test -n "${version_name}"
          cat > tiktak-tv-android-tv.json <<JSON
          {"versionCode":${version_code},"versionName":"${version_name}","apkUrl":"https://github.com/zachgus33/Tik-TakTV/releases/download/tv-latest/tiktak-tv-android-tv.apk","sha256":"${sha256}"}
          JSON
      - name: Publish stable Downloader asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view tv-latest >/dev/null 2>&1; then
            gh release create tv-latest \
              --target "${GITHUB_SHA}" \
              --title "TikTak TV for Android TV and Fire TV" \
              --notes "Signed TikTak TV APK for Fire TV, Firestick, Android TV, and Google TV. This stable release is updated in place for Downloader installations." \
              --latest=false
          fi
          gh release upload tv-latest \
            tiktak-tv-android-tv.apk \
            tiktak-tv-android-tv.apk.sha256 \
            tiktak-tv-android-tv.json \
            --clobber
      - name: Upload signed APK evidence
        uses: actions/upload-artifact@v7
        with:
          name: TikTak-TV-signed-release
          path: |
            tiktak-tv-android-tv.apk
            tiktak-tv-android-tv.apk.sha256
            tiktak-tv-android-tv.json
          if-no-files-found: error
          retention-days: 30
