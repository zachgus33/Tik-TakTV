name: Build signed Android Phone bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-phone-release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      TIKTAK_MOBILE_STORE_PASSWORD: ${{ secrets.TIKTAK_MOBILE_STORE_PASSWORD }}
      TIKTAK_MOBILE_KEY_ALIAS: ${{ secrets.TIKTAK_MOBILE_KEY_ALIAS }}
      TIKTAK_MOBILE_KEY_PASSWORD: ${{ secrets.TIKTAK_MOBILE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore permanent mobile upload key
        env:
          TIKTAK_MOBILE_KEYSTORE_BASE64: ${{ secrets.TIKTAK_MOBILE_KEYSTORE_BASE64 }}
        run: |
          test -n "${TIKTAK_MOBILE_KEYSTORE_BASE64}"
          test -n "${TIKTAK_MOBILE_STORE_PASSWORD}"
          test -n "${TIKTAK_MOBILE_KEY_ALIAS}"
          test -n "${TIKTAK_MOBILE_KEY_PASSWORD}"
          TIKTAK_MOBILE_KEYSTORE_FILE="${RUNNER_TEMP}/tiktak-mobile-upload.p12"
          printf '%s' "${TIKTAK_MOBILE_KEYSTORE_BASE64}" | base64 --decode > "${TIKTAK_MOBILE_KEYSTORE_FILE}"
          echo "TIKTAK_MOBILE_KEYSTORE_FILE=${TIKTAK_MOBILE_KEYSTORE_FILE}" >> "${GITHUB_ENV}"
      - name: Test, lint, and build signed Play bundle
        run: ./gradlew :mobileApp:testDebugUnitTest :mobileApp:lintRelease :mobileApp:bundleRelease -Pnuvio.android.distribution=playstore --stacktrace
      - name: Upload signed bundle
        uses: actions/upload-artifact@v7
        with:
          name: TikTak-TV-Android-Phone-signed-AAB
          path: mobileApp/build/outputs/bundle/release/mobileApp-release.aab
          if-no-files-found: error
          retention-days: 30
