name: Native Android TV preview

on:
  push:
    branches: [web-enhanced-pages]
    paths:
      - "nativeTvApp/**"
      - "composeApp/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/native-tv-android.yml"
  pull_request:
    paths:
      - "nativeTvApp/**"
      - "composeApp/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/native-tv-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test, lint, and build native TV preview
        run: ./gradlew :nativeTvApp:testDebugUnitTest :nativeTvApp:lintDebug :nativeTvApp:assembleDebug -Pnuvio.android.distribution=playstore --stacktrace
      - name: Upload side-by-side preview APK
        uses: actions/upload-artifact@v7
        with:
          name: TikTak-TV-Native-Preview
          path: nativeTvApp/build/outputs/apk/debug/nativeTvApp-debug.apk
          if-no-files-found: error
          retention-days: 14

  tv-emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 34]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TikTak-TV-Native-Preview
          path: nativeTvApp/build/outputs/apk/debug
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch native app and exercise remote input
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86
          target: android-tv
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            adb install -r nativeTvApp/build/outputs/apk/debug/nativeTvApp-debug.apk
            adb logcat -c
            adb shell am start -W -n com.tiktaktv.tv.nativepreview/com.tiktaktv.nativepreview.NativeTvActivity
            sleep 20
            adb shell input keyevent 20
            adb shell input keyevent 22
            adb shell input keyevent 21
            adb shell input keyevent 19
            adb shell input keyevent 23
            sleep 3
            adb shell dumpsys activity activities > native-tv-activity.txt
            adb exec-out screencap -p > nativeTvApp/build/native-tv-auth.png
            adb logcat -d > native-tv-logcat.txt
            grep -Eq "(topResumedActivity|ResumedActivity).*com.tiktaktv.tv.nativepreview" native-tv-activity.txt
            ! grep -A 30 "FATAL EXCEPTION" native-tv-logcat.txt | grep -q "com.tiktaktv.tv.nativepreview"

            for spec in "1280x720:213:720p" "1920x1080:320:1080p" "3840x2160:640:4k"; do
              size="${spec%%:*}"
              remainder="${spec#*:}"
              density="${remainder%%:*}"
              label="${remainder#*:}"
              adb shell am force-stop com.tiktaktv.tv.nativepreview
              adb shell wm size "$size"
              adb shell wm density "$density"
              adb shell am start -W -n com.tiktaktv.tv.nativepreview/com.tiktaktv.nativepreview.NativeTvActivity --ez native_tv_shell_preview true
              sleep 5
              adb shell input keyevent 20
              adb shell input keyevent 23
              sleep 2
              adb shell dumpsys activity activities > "native-tv-activity-${label}.txt"
              adb exec-out screencap -p > "nativeTvApp/build/native-tv-shell-${label}.png"
              grep -Eq "(topResumedActivity|ResumedActivity).*com.tiktaktv.tv.nativepreview" "native-tv-activity-${label}.txt"
            done

            adb logcat -d > native-tv-logcat.txt
            ! grep -A 30 "FATAL EXCEPTION" native-tv-logcat.txt | grep -q "com.tiktaktv.tv.nativepreview"
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TikTak-TV-native-emulator-api-${{ matrix.api-level }}
          path: |
            nativeTvApp/build/native-tv-*.png
            native-tv-activity*.txt
            native-tv-logcat.txt
          if-no-files-found: warn
          retention-days: 14
